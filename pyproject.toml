[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "warrant-llm"
dynamic = ["version"]
description = "A least-privilege controller for local coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
authors = [{ name = "Warrant contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.28,<0.29",
  "ollama>=0.6.2,<0.7",
  "pathspec>=1.0,<2",
  "pydantic>=2.11,<3",
]

[project.urls]
Homepage = "https://github.com/aminobutyric/warrant"
Documentation = "https://github.com/aminobutyric/warrant/tree/release/docs"
Issues = "https://github.com/aminobutyric/warrant/issues"
Source = "https://github.com/aminobutyric/warrant"

[project.scripts]
ulg = "ulg.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.135,<7",
  "mypy>=1.16,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ulg"]

[tool.hatch.build.targets.wheel.force-include]
"config/policy.example.toml" = "ulg/resources/policy.toml"

[tool.hatch.build.targets.sdist]
only-include = [
  ".gitignore",
  "CHANGELOG.md",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  "SUPPORT.md",
  "config",
  "docs",
  "pyproject.toml",
  "runner",
  "scripts",
  "src",
  "testdata",
  "tests",
  "uv.lock",
]

[tool.hatch.version]
path = "src/ulg/__init__.py"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ulg"]

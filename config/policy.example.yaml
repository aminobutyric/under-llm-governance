# Illustrative Phase 0 policy. This file is not consumed by code yet.
# Defaults in the future loader must be at least as restrictive as these values.
version: 1

model:
  provider: ollama
  endpoint: http://127.0.0.1:11434
  request_timeout: 120s
  max_response_bytes: 1048576

task:
  max_turns: 40
  max_tool_calls: 100
  max_duration: 30m

workspace:
  mode: disposable_copy
  max_bytes: 1073741824
  preserve_failed_for: 24h
  deny_symlinks: true
  deny_special_files: true
  deny_cross_mounts: true

tools:
  list_files:
    decision: allow
    max_entries: 10000
    max_depth: 32
  read_file:
    decision: allow
    max_bytes: 1048576
  search_text:
    decision: allow
    max_matches: 1000
    max_output_bytes: 1048576
  apply_patch:
    decision: allow
    max_patch_bytes: 1048576
    max_changed_files: 100
  show_diff:
    decision: allow
    max_output_bytes: 2097152
  run_task:
    decision: allow
    allowed_recipes:
      - test
      - lint
      - format
  arbitrary_exec:
    decision: deny
  network:
    decision: deny
  install_dependencies:
    decision: deny
  git_push:
    decision: deny

sandbox:
  backend: rootless_docker
  network: none
  read_only_root: true
  drop_capabilities: all
  no_new_privileges: true
  memory: 2GiB
  cpus: 2
  pids: 256
  timeout: 10m
  max_output_bytes: 10485760
  tmpfs_bytes: 268435456

# Recipes are trusted configuration. A model may select an allowed recipe by
# name, but it may not supply or alter argv, environment, image, or sandbox
# flags. Project-local configuration may restrict this list, not expand it.
recipes:
  test:
    argv: ["go", "test", "./..."]
    timeout: 10m
  lint:
    argv: ["go", "vet", "./..."]
    timeout: 10m
  format:
    argv: ["gofmt", "-w", "."]
    timeout: 5m

promotion:
  decision: ask
  require_unchanged_source: true
  show_diff: true

audit:
  format: jsonl
  include_file_contents: false
  include_environment: false
  max_preview_bytes: 4096
